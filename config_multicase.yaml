PROJECT:
  path_directory: "./experiments/refactored_run"
  seed: 42

DEVICE:
  prefer: ["cuda", "mps", "cpu"]
  multi_gpu: True                 # DataParallel only on CUDA
  gpu_list: [0,1]

TRAINER:
  train_from_checkpoint: False
  checkpoint: "/work/adam2/SCAR-EP-PINN/experiments/run_20250901_073322/model_data_epoch_5.pth"            
  phases: ["phase2" ]               # "phase1", "phase2", or "phase3"
  
MODEL:
  in_features: 8                   # old setting; PINN uses [x, y, t, g_il]
  out_features: 2                  # (v,w) 
  n_layers: 9
  n_neurons: 256
  num_first: 256
  num_last: 256
  activation: "tanh"
  activation_last: "silu"

  scaler_eps: 1.0e-12

  loss_weights:
    w_pde: 0.01
    w_ode: 0.01
    w_bc:  0.01
    w_ic:  1.0
    w_data: 1.0

  physics:
    a:   0.15
    k:   8.0
    mu1: 0.2
    mu2: 0.3
    eps: 0.002
    b:   0.15
    h:   0.1
    beta: 1.4e-5         # 0.14*1e-4
    Cm:   1.0e-3         # mF/cm^2
    mS_cm: 10.0          # mS/cm
    vm_rest: -80.0      # mV
    vm_norm: 100.0  # mV

OPTIM:
  phase1:                      # Data pretraining
    optimizer: "adam"
    lr: 2.0e-4
    weight_decay: 0.0
    scheduler:
      name: "StepLR"
      gamma: 0.98
      step_size: 4000
    epochs: 704 #5

  phase2:                      # PDE + Data (Adam)
    optimizer: "adam"
    lr: 1.0e-5
    weight_decay: 0.0
    scheduler:
      name: "StepLR"
      step_size: 2000
      gamma: 0.98
    clip_grad_norm: 1.0
    epochs: 0 #5

  lbfgs:                       # PDE + Data (L-BFGS)
    lr: 0.1
    max_iter: 20
    history_size: 100
    line_search_fn: "strong_wolfe"
    tolerance_grad: 1.0e-07
    tolerance_change: 1.0e-09
    scheduler:
      name: "ExponentialLR"
      gamma: 0.98
    epochs: 3

  resampling:
    adam_every_batches: 1000      # 0 disables; otherwise resample every N batches
    lbfgs_every_batches: 1000

DATA:
  case: "case_1"
  fibernet_checkpoint: "./experiments/fibernet/{case}/fibernet.pth"

  geometry:
    extra: false
    long: false
    isotropic: true

  constants:
    t_norm: 12.9
    um_to_mm: 1.0e-3
    s_mtomm2_TU: 9.214285714285714   # 12.9/1.4

  sampling:
    # Legacy sampling settings; the HDF5 loader reads g_il from the file.
    g_il_values: [0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04, 0.045,
                  0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1]

    sampled_indices: null
    sampled_indices_strategy: "exclude_every_4_then_take_12"
    indices_collocation: [0,1, 3, 15, 16, 17, 18]
    indices_test: [-1]

    # Thinning in time/space
    slice_t: 1
    nx_test_slice: 724 #200
    nt_test_slice: 1

    # Initial condition grid
    ic_space_slice: 1
    ic_time_steps: 1

    collocation_data: "all"
    num_domain: 100 # Batch size for collocation points
    num_boundary: 100 # Batch size for boundary points
    num_init: 100 # Batch size for initial condition points

  loader:
    batch_size: 4096
    batch_size_lbfgs: 1000000
    num_workers: 0
    pin_memory: true
    prefetch_factor: 2
    shuffle_train: true

EVAL:
  metrics:
    compute_mae: true
    compute_rel_l1: true

POSTPROC:
  activation_threshold: -20.0
  dt_ms: 5.0
