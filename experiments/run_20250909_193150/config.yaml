PROJECT:
  path_directory: experiments/run_20250909_193150
  seed: 42
DEVICE:
  prefer:
  - cuda
  - mps
  - cpu
  multi_gpu: true
  gpu_list:
  - 0
  - 1
TRAINER:
  train_from_checkpoint: false
  checkpoint: /work/adam2/SCAR-EP-PINN/experiments/run_20250901_073322/model_data_epoch_5.pth
  phases:
  - phase2
MODEL:
  in_features: 8
  out_features: 2
  n_layers: 9
  n_neurons: 256
  num_first: 256
  num_last: 256
  activation: tanh
  activation_last: silu
  scaler_eps: 1.0e-12
  loss_weights:
    w_pde: 0.01
    w_ode: 0.01
    w_bc: 0.01
    w_ic: 1.0
    w_data: 1.0
  physics:
    a: 0.15
    k: 8.0
    mu1: 0.2
    mu2: 0.3
    eps: 0.002
    b: 0.15
    h: 0.1
    beta: 1.4e-05
    Cm: 0.001
    mS_cm: 10.0
    vm_rest: -80.0
    vm_norm: 100.0
OPTIM:
  phase1:
    optimizer: adam
    lr: 0.0002
    weight_decay: 0.0
    scheduler:
      name: StepLR
      gamma: 0.98
      step_size: 4000
    epochs: 5
  phase2:
    optimizer: adam
    lr: 1.0e-05
    weight_decay: 0.0
    scheduler:
      name: StepLR
      step_size: 2000
      gamma: 0.98
    clip_grad_norm: 1.0
    epochs: 8
  lbfgs:
    lr: 0.1
    max_iter: 20
    history_size: 100
    line_search_fn: strong_wolfe
    tolerance_grad: 1.0e-07
    tolerance_change: 1.0e-09
    scheduler:
      name: ExponentialLR
      gamma: 0.98
    epochs: 3
  resampling:
    adam_every_batches: 1000
    lbfgs_every_batches: 1000
DATA:
  paths:
    vm: ./data/vm_variation_scar_full.npy
    W: ./data/W_variation_scar_full.npy
    conductivities: ./data/conductivities_variation_scar_full.npy
    conductivities_boundary: ./data/conductivities_boundary_1.npy
    boundary_edge_centroids: ./data/boundary_edge_centroids.npy
    boundary_normals: ./data/boundary_normals.npy
  geometry:
    extra: false
    long: false
    isotropic: true
  constants:
    t_norm: 12.9
    um_to_mm: 0.001
    s_mtomm2_TU: 9.214285714285714
  sampling:
    g_il_values:
    - 0.01
    - 0.015
    - 0.02
    - 0.025
    - 0.03
    - 0.035
    - 0.04
    - 0.045
    - 0.05
    - 0.055
    - 0.06
    - 0.065
    - 0.07
    - 0.075
    - 0.08
    - 0.085
    - 0.09
    - 0.095
    - 0.1
    sampled_indices: null
    sampled_indices_strategy: exclude_every_4_then_take_12
    indices_collocation:
    - 0
    - 1
    - 3
    - 15
    - 16
    - 17
    - 18
    indices_test:
    - -1
    slice_t: 1
    nx_test_slice: 200
    nt_test_slice: 1
    ic_space_slice: 1
    ic_time_steps: 1
    collocation_data: all
    num_domain: 100
    num_boundary: 100
    num_init: 100
  loader:
    batch_size: 4096
    batch_size_lbfgs: 1000000
    num_workers: 12
    pin_memory: true
    prefetch_factor: 2
    shuffle_train: true
EVAL:
  metrics:
    compute_mae: true
    compute_rel_l1: true
POSTPROC:
  activation_threshold: -20.0
  dt_ms: 5.0
